<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>한컷투자 약관 안내</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
  :root{--ink:#1a1a1a;--sub:#5b6472;--line:#e8eaed;--brand:#1E40AF;--soft:#f6f7f9}
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink);background:#fff;line-height:1.7;word-break:keep-all;
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    padding:40px 20px;
  }
  .card{max-width:440px;width:100%}
  .badge{
    display:inline-block;font-size:12px;font-weight:700;color:var(--brand);
    background:rgba(30,64,175,.08);padding:5px 11px;border-radius:999px;margin-bottom:16px;
  }
  h1{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-bottom:6px}
  p.sub{color:var(--sub);font-size:14px;margin-bottom:28px}
  a.link{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px;border:1px solid var(--line);border-radius:14px;
    text-decoration:none;color:var(--ink);font-weight:600;font-size:15px;
    margin-bottom:12px;transition:border-color .15s,transform .15s;
  }
  a.link:hover{border-color:var(--brand);transform:translateY(-1px)}
  a.link span.arrow{color:var(--sub);font-weight:400}
  footer{margin-top:24px;font-size:12px;color:#9aa1ad;text-align:center}
</style>
</head>
<body>
  <div class="card">
    <span class="badge">한컷투자</span>
    <h1>약관 및 정책 안내</h1>
    <p class="sub">한컷투자 서비스 운영에 적용되는 약관입니다.</p>
    <a class="link" href="./terms.html">서비스 이용약관 <span class="arrow">→</span></a>
    <a class="link" href="./privacy.html">개인정보처리방침 <span class="arrow">→</span></a>
    <footer>© 앤조이코드 · 한컷투자 · hancut.help@gmail.com</footer>
  </div>
</body>
</html>
